<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suara onboarding v3</title>
<!-- BUILDSTAMP category-card-art-r8 — a string written in THIS build. The deploy probe greps
     for this, not for "the page loads": a reachable page that serves the PREVIOUS build passes a
     liveness check and tells you nothing. Bump it whenever the build changes materially. -->
<link rel="stylesheet" href="flow-shared.css">
<style>
:root{
  --t-in:300ms; --t-out:220ms;
  --travel:22px; --stagger:32ms; --t-prog:520ms;
  --ease:cubic-bezier(.22,.61,.24,1);
}
*{box-sizing:border-box}
/* Reza: "this is going to be used through a browser" + "everything always stays in one screen".
   So: no fake phone chrome, no page scroll ever, and the whole thing sized off dvh so mobile
   browser chrome appearing/disappearing cannot introduce a scrollbar. Everything below scales
   with --u, one unit derived from the actual viewport, so a 640px-tall laptop window and a
   900px-tall one both fit without a scrollbar rather than only the tall one fitting. */
html,body{height:100%;overflow:hidden}
body{margin:0;background:#FBF4EA;font-family:PJS,ui-sans-serif,system-ui,sans-serif;
  display:flex;justify-content:center;
  --u:clamp(.72px, .1vh + .05vw, 1.06px);}
.shell{width:min(460px,100%);height:100dvh;background:#FBF4EA;overflow:hidden;position:relative;
  display:flex;flex-direction:column}
@media (min-width:900px){
  body{background:#EFE7DA;align-items:center}
  .shell{height:min(920px,96dvh);border-radius:30px;
    box-shadow:0 40px 90px -50px rgba(60,40,25,.55);border:1px solid rgba(36,28,21,.08)}
}
/* ⛔⛔ THE CHROME USED TO LIVE INSIDE THE SCALED BOX. Reza, 23 Aug: "its making different pages
   inconsistent with their header sizes and other components". He was right, and it was structural.
   Every screen rendered its own nav row, its own title block and its own button INSIDE `.fit`, and
   `.fit` gets a per-screen scale so it fits. So a content-heavy screen scaled to 0.85 and shrank
   its own header, while the next screen sat at 1.0 — measured: nav row 52px tall on one screen and
   44px on the next, sitting at different heights on the page. No amount of tuning fixes that,
   because the header was downstream of how much CONTENT the screen happened to have.
   ⇒ The bar, the nav row, the title block and the button are now SHELL chrome. They are rendered
   once, they live outside `.stage`, and they are never scaled. The only thing that can flex is the
   answer area. The headers are now identical across screens BY CONSTRUCTION rather than because a
   test says so — a whole class of bug is gone rather than guarded. (better-layout #8: sticky chrome
   floats above the content layer, it doesn't dam it.) */
.stage{position:relative;flex:1;overflow:hidden;min-height:0}
.scr{position:absolute;inset:0;overflow:hidden}
/* ⭐⭐ THE NO-SCROLL RULE, RESTATED HONESTLY. Measured 23 Aug: on an iPhone the answer area is
   ~340px and eleven of the nineteen screens hold 400–920px of content. "Never scroll" was
   therefore being delivered by shrinking — down to 60% on the first-week screen — and shrinking is
   exactly what made the pages look inconsistent to Reza. You cannot fit 920px into 340px; you can
   only lie about it.
   ⇒ The promise that is worth keeping is the one he actually cares about: THE QUESTION, THE ANSWER
   AND THE BUTTON ARE ALWAYS VISIBLE, AT THE SAME SIZE, ON EVERY SCREEN. That is now guaranteed by
   the chrome living outside the stage. Below 90% we stop shrinking and let the ANSWER LIST scroll
   inside its own box — never the page, never the header, never the button. A list of seven
   categories that scrolls is normal; a page rendered at 60% is not. */
.scr.scrolls{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  scrollbar-width:none}
.scr.scrolls::-webkit-scrollbar{display:none}
.scr.scrolls .fit{position:relative;min-height:0}
/* better-layout #5: hidden content needs a visible cue, or it may as well not exist */
.stage.hasScroll::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;
  background:linear-gradient(to top,#FBF4EA,rgba(251,244,234,0));pointer-events:none;z-index:4}
.fit{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;
  min-height:100%;transform-origin:top center;will-change:transform}
/* natural height — never squashed, so nothing can spill under the footer */
.scr .body{flex:1 0 auto;min-height:0}

/* container fades, children translate — split across DOM levels so it reads as one soft object */
/* held invisible until it has been measured and scaled — nothing animates before it fits */
.scr.pre{opacity:0}
/* ⛔⛔ THE BUG BEHIND "the back button breaks everything". The direction marker on the screen was
   `.back` — the SAME class name as the back BUTTON. So pressing back put `class="scr back"` on the
   screen, which picked up the button's rules: width:34px, height:34px, border-radius:50%,
   display:grid. The screen became a circle the size of a button, its content reflowed into a
   sliver, and the fit maths measured 1073px of content into 34px of space and clamped to the 0.45
   floor. Every back press, every screen, not intermittent — the probe caught all eight.
   The direction modifier is now `.rev`. `.back` means the button and nothing else. */
@media (prefers-reduced-motion:no-preference){
  .scr.in{animation:fade var(--t-in) var(--ease) both}
  .scr.in .anim{animation:rise var(--t-in) var(--ease) both;animation-delay:var(--d,0ms)}
  .scr.out{animation:fadeOut var(--t-out) var(--ease) both}
  .scr.in.rev .anim{animation-name:riseBack}
  /* the chrome text swaps in place with the same motion, so the header reads as one steady object
     whose label changes rather than a header that is rebuilt every step */
  .chrome-in .anim{animation:rise var(--t-in) var(--ease) both;animation-delay:var(--d,0ms)}
  .chrome-in.rev .anim{animation-name:riseBack}
}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* the outgoing screen drifts a little and dims rather than cutting — it overlaps the incoming
   one, which is what makes a step feel continuous instead of like two slides */
@keyframes fadeOut{from{opacity:1;transform:translateX(0)}
  to{opacity:0;transform:translateX(calc(var(--travel) * -0.45))}}
/* rise, not slide: a small vertical lift with a touch of horizontal reads softer than a pure
   sideways push, and it does not fight the fit transform on the parent */
@keyframes rise{from{opacity:0;transform:translate3d(calc(var(--travel) * .5), 10px, 0)}
  to{opacity:1;transform:none}}
@keyframes riseBack{from{opacity:0;transform:translate3d(calc(var(--travel) * -.5), 10px, 0)}
  to{opacity:1;transform:none}}

.bar{height:3px;background:rgba(36,28,21,.09);position:relative;flex:none}
.bar i{position:absolute;inset:0 auto 0 0;background:#E1552E;border-radius:0 3px 3px 0;
  transition:width var(--t-prog) var(--ease)}
.navrow{display:flex;align-items:center;gap:12px;padding:14px 20px 4px;flex:none}
/* our own display:flex beats the UA [hidden] rule, so say it explicitly or the welcome screen
   keeps a phantom nav row */
.navrow[hidden],.foot[hidden]{display:none}
.back{width:34px;height:34px;border-radius:50%;border:1px solid rgba(36,28,21,.14);background:#fff;
  display:grid;place-items:center;cursor:pointer;color:#241C15;-webkit-appearance:none;appearance:none;
  padding:0;transition:opacity 160ms,transform 160ms}
.back svg{width:17px;height:17px;stroke:#241C15}
.back[hidden]{opacity:0;pointer-events:none}
.back:active{transform:scale(.94)}
.pos{margin-left:auto;font-size:12.5px;color:#A69A8A;font-weight:600;letter-spacing:.02em}

/* the title block is CHROME, not content: same place, same size, on every question. Only its
   words change. This is the half of the fix that Reza actually sees. */
.head{padding:calc(2*var(--u)) calc(24*var(--u)) 0;flex:none}
.head:empty{display:none}
.body{padding:calc(12*var(--u)) calc(24*var(--u)) calc(14*var(--u))}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#E1552E;
  margin-bottom:10px}
h1{font-size:clamp(17px, calc(27*var(--u)), 29px);line-height:1.14;letter-spacing:-.02em;color:#241C15;margin:0 0 8px;font-weight:700}
.sub{font-size:clamp(13px, calc(15*var(--u)), 16px);line-height:1.5;color:#7C7062;margin:0}
/* ⭐ The skip row is ALWAYS in the DOM and only its visibility changes. If it were added and
   removed the footer would be two different heights, the content area would jump by ~30px between
   steps, and we would be back to the inconsistency he complained about — just in a subtler place
   that a screenshot would not obviously show. Reserve the space. */
.foot{padding:calc(10*var(--u)) calc(24*var(--u)) calc(20*var(--u));flex:none}
.skip.ghost{visibility:hidden;pointer-events:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:#241C15;color:#fff;
  border:0;width:100%;padding:calc(15*var(--u));border-radius:100px;font:inherit;
  font-size:clamp(14px, calc(16*var(--u)), 17px);font-weight:700;
  cursor:pointer;transition:transform 140ms var(--ease),filter 140ms}
.btn:active{transform:scale(.985)}
.btn.accent{background:#E1552E}
.skip{display:block;width:100%;text-align:center;margin-top:12px;background:none;border:0;
  color:#A69A8A;font:inherit;font-size:13.5px;cursor:pointer}

/* ---------- welcome (Bob's direction, three faults fixed) ---------- */
.wel{position:relative;flex:1;display:flex;flex-direction:column;padding:26px 26px 0}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand img{width:38px;height:38px;border-radius:11px}
.brand b{font-size:25px;color:#E1552E;letter-spacing:-.02em}
/* FIX 1: the pills were colliding with each other and with the cards. They are now a laid-out
   row above the stack and a single anchored tag below it — nothing floats. */
.stagewrap{position:relative;margin:auto 0 6px;flex:none}
.pill{background:#fff;border:1px solid rgba(36,28,21,.08);border-radius:100px;padding:7px 14px;
  font-size:12.5px;font-weight:700;color:#241C15;box-shadow:0 6px 18px -12px rgba(60,40,25,.5);
  display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill.ok{color:#2F6B3D}
.pill svg{width:14px;height:14px;flex:none;opacity:.75}
.pill.ok svg{opacity:1}
.stack{position:relative;height:clamp(118px, calc(212*var(--u)), 230px);display:grid;place-items:center}
.pin{position:absolute;z-index:3}
/* Bob's positions. They overlap the CARDS on purpose — that is the depth — but the 2x rule from
   better-layout means they must never overlap each OTHER, which is where his collided. */
.pin.a{top:-6px;left:50%;transform:translateX(-58%)}
.pin.b{bottom:24px;left:-4px}
.pin.c{bottom:52px;right:-4px}
.pin.d{bottom:-14px;left:50%;transform:translateX(-30%)}
.stack img{position:absolute;width:calc(126*var(--u));height:calc(158*var(--u));object-fit:cover;
  border-radius:14px;
  border:4px solid #fff;box-shadow:0 18px 40px -22px rgba(60,40,25,.55)}
.stack img:nth-child(1){transform:rotate(-9deg) translateX(-88px)}
.stack img:nth-child(2){transform:rotate(4deg) translateX(88px)}
.stack img:nth-child(3){width:calc(150*var(--u));height:calc(186*var(--u));z-index:2}
/* FIX 2: the dead gap between the pills and the headline is closed — the copy block starts
   directly under the stack instead of 200px below it. */
.welcopy{margin-top:28px;margin-bottom:auto}
.welcopy h1{font-size:clamp(25px, calc(41*var(--u)), 46px);line-height:1.02;
  letter-spacing:-.035em;margin-bottom:calc(9*var(--u))}
/* FIX 3: the count is stated ONCE, in the pill. The sentence says what it is, not how many. */
.welcopy p{font-size:15.5px;line-height:1.5;color:#7C7062;margin:0}
.lang{display:flex;gap:10px;margin:18px 0 0}
.lang button{flex:1;padding:14px;border-radius:100px;border:1px solid rgba(36,28,21,.12);
  background:#fff;font:inherit;font-size:14.5px;font-weight:700;color:#241C15;cursor:pointer;
  transition:background 160ms,color 160ms,border-color 160ms}
.lang button.on{background:#E1552E;border-color:#E1552E;color:#fff}

/* ---------- the new final screen ---------- */
[contenteditable],input,textarea,select{outline:none;font-size:16px}
[contenteditable]:empty::before{content:attr(data-ph);color:#B6AC9E}
[contenteditable]:focus{box-shadow:0 0 0 2px rgba(225,85,46,.22);border-radius:6px}
.cats{display:flex;flex-direction:column;gap:calc(7*var(--u));margin-top:calc(3*var(--u))}
.cat{display:grid;grid-template-columns:22px 1fr;grid-template-rows:auto auto;gap:2px 12px;
  text-align:left;background:#fff;border:1px solid rgba(36,28,21,.1);border-radius:15px;
  padding:calc(11*var(--u)) calc(14*var(--u));font:inherit;cursor:pointer;
  transition:border-color 160ms var(--ease),background 160ms var(--ease)}
/* flow-shared.css styles a .tick of its own (green, filled) and it was bleeding through, so
   unticked boxes rendered as solid green — reading as "already on". Reset explicitly. */
.cat .tick{grid-row:1/3;width:22px;height:22px;border-radius:7px;
  border:1.5px solid rgba(36,28,21,.2)!important;background:#fff!important;
  align-self:center;position:relative;box-shadow:none!important;
  transition:background 160ms,border-color 160ms}
.cat .tick::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);
  transition:transform 160ms var(--ease)}
.cat.on{border-color:#E1552E;background:#FDF0EA}
.cat.on .tick{background:#E1552E!important;border-color:#E1552E!important}
.cat.on .tick::after{transform:rotate(45deg) scale(1)}
.cat{position:relative;overflow:hidden}
.cat .tart{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:42px;height:42px;
  object-fit:contain;opacity:.34;pointer-events:none;
  transition:opacity 200ms var(--ease),transform 240ms var(--ease)}
.cat.on .tart{opacity:.5;transform:translateY(-50%) scale(1.06) rotate(-3deg)}
.cn,.cd{position:relative;z-index:1}
.cn{font-size:15px;font-weight:700;color:#241C15}
.cd{font-size:13px;color:#7C7062;grid-column:2;padding-right:44px}
.note{margin-top:14px;font-size:13px;color:#A69A8A;line-height:1.5}

/* ---------- density ----------
   Ten of nineteen screens needed an internal scroll on an iPhone, and the single biggest cause was
   the option row: a 38px glyph inside 14px of padding is a 77px row, so four choices ate 308px of
   a 356px answer area before the question was even counted. Tightened to ~52px, which is still
   well above a 44px touch target and gets most screens back to fitting outright. Overridden here
   rather than in flow-shared.css because the other prototypes still render against that file. */
/* ⛔ THE GLYPH COLOUR WAS BAKED INTO THE MARKUP. Each option in screens-data.js hardcodes its own
   `stroke="…"`, and whichever option the original static mockup had selected was written with the
   coral stroke. Now that selection is real, the coral stayed stuck on "Bookings" while the tick
   moved to "Enquiries" — two options looking half-selected at once. A presentation attribute is a
   value frozen at authoring time; the STATE has to come from CSS or it cannot follow the user.
   (CSS beats a presentation attribute, so no !important is needed here.) */
.opt .glyph svg{stroke:#3B3128}
.opt.sel .glyph svg{stroke:#E1552E}
.opts{margin-top:10px;gap:7px}
.opt{padding:10px 13px;gap:11px}
.opt.sel{padding:9px 12px}
.glyph{width:30px;height:30px;border-radius:10px}
.glyph svg{width:16px;height:16px}
.odesc{margin-top:1px}
/* ---------- business-type cards, restructured ----------
   Reza: custom branded icons, top right, slightly faded, and larger type. Moving the art out of
   the text's way entirely — a corner motif rather than a bullet — is what buys the extra type
   size. Anchoring text bottom-left and art top-right also means a long name wraps INTO empty
   space instead of into the glyph. */
.tile{min-height:88px;padding:12px 13px;position:relative;overflow:hidden;justify-content:flex-end}
/* ⛔ FULLY INSIDE THE CARD, not bleeding off the corner. My first pass had this at top:-8px
   right:-10px, so the scissors and the book were sliced by the card edge. Bleeding art is a real
   technique, but "the icon looks cut off" is the exact complaint Reza has raised three times on
   this screen — deliberate clipping and a bug look identical to the person looking at it. The
   test below asserts the art sits inside its tile, so this cannot drift back. */
.tile .tart{position:absolute;top:9px;right:9px;width:52px;height:52px;object-fit:contain;
  opacity:.32;pointer-events:none;
  transition:opacity 200ms var(--ease),transform 240ms var(--ease)}
.tile.sel .tart{opacity:.58;transform:scale(1.05) rotate(-3deg)}
.tile .tname,.tile .tsub{position:relative;z-index:1}
.tile .tname{font-size:15px;line-height:1.2;padding-right:26px}
.tile .tsub{font-size:12px;margin-top:3px;padding-right:8px}
.tile.hasart svg{display:none}
.chips{margin-top:10px;gap:7px}
.sm{margin-top:8px}

/* ---------- text fields need their own surface ----------
   Reza, 23 Aug: "the text fields could have a better background colour than having the same
   background as the main background". He is describing better-layout #2 — a control that shares
   the page's background is not reading as a control. A dashed outline on the same cream reads as
   a placeholder for something missing, not as somewhere to type. White gives them a surface, the
   inset line gives them depth, and the focus ring now lives on the CONTAINER so the whole field
   lights up rather than a rectangle around the text node inside it. */
.note,.field,.up{background:#fff;border-style:solid;border-color:rgba(36,28,21,.11);
  box-shadow:inset 0 1px 2px rgba(36,28,21,.045),0 1px 0 rgba(255,255,255,.6)}
.note:focus-within,.field:focus-within{border-color:#E1552E;
  box-shadow:0 0 0 3px rgba(225,85,46,.15),inset 0 1px 2px rgba(36,28,21,.04)}
/* the inner ring is now redundant and double-outlined the field */
[contenteditable]:focus{box-shadow:none}
.field.on{border-color:rgba(36,28,21,.28);box-shadow:inset 0 1px 2px rgba(36,28,21,.05)}
/* ...and the same for everything you TAP. `.tile`, `.opt`, `.chip` and `.holrow` shipped with no
   background at all, so the page cream showed through and a choice read as a dotted outline rather
   than a card. Reza caught this twice — first the text fields, then these. One rule both times: a
   control must not share the page's surface. Unselected now sits on white and lifts slightly;
   selected keeps the coral tint, so the DISTANCE between the two states grows rather than the
   selected state merely being tinted against an identical background. */
.tile,.opt,.holrow,.chip{background:#fff;
  box-shadow:0 1px 2px rgba(36,28,21,.04),0 4px 10px -8px rgba(36,28,21,.28);
  transition:background 150ms var(--ease),border-color 150ms var(--ease),
    box-shadow 150ms var(--ease),transform 120ms var(--ease)}
.tile.sel,.opt.sel,.holrow.sel{background:#FDF0EA;
  box-shadow:0 5px 15px -8px rgba(225,85,46,.55)}
.chip.sel{box-shadow:0 5px 13px -7px rgba(36,28,21,.6)}
.tile:active,.opt:active,.holrow:active,.chip:active{transform:scale(.985)}

/* ---------- "Suara knows N things" ----------
   Reza: "what else could we do to be more interactive and show value". The nav row was spending
   its whole width on a label repeating the question already printed underneath it in 23px type.
   That space now carries the one thing the customer cannot see: what their answers have already
   DECIDED. It costs zero vertical space, which matters because vertical space is the scarce
   resource on every screen here.
   ⭐ It lists CONSEQUENCES, not an echo. Reza's own standing test is "does it give them work, or
   tell them something they didn't know?" — a summary of what they just typed fails that test.
   "Halal is now blocked and we will never write it" passes it. */
.known{margin-left:auto;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid
  rgba(36,28,21,.1);border-radius:100px;padding:6px 12px 6px 9px;font:inherit;font-size:12px;
  font-weight:700;color:#241C15;cursor:pointer;white-space:nowrap;
  box-shadow:0 3px 10px -7px rgba(36,28,21,.5);transition:transform 140ms var(--ease)}
.known:active{transform:scale(.96)}
.known[hidden]{display:none}
.known b{display:grid;place-items:center;min-width:19px;height:19px;border-radius:99px;
  background:#E1552E;color:#fff;font-size:11px;font-weight:800;padding:0 5px}
/* the mark ships with a transparent background and its own warm gradient, so it needs no plate */
/* the tight mark is 428x214 of ink, so a 2:1 box — no padding to see through, which means the
   gap below is the whole gap. 6px, not 7px+1.4px of the asset's own dead space. */
.kmark{width:18px;height:9px;flex:none;display:block}
/* ⭐ GRADIENT WORDMARK, WITH THE STOPS CHOSEN BY ARITHMETIC RATHER THAN BY EYE.
   The mark's own ramp is #FF5A45 → #FFC24B, and #FFC24B on white is 1.58:1 — invisible. At 12px
   bold this text needs 4.5:1, so the ramp is compressed to #C0341A → #AE6412, measured at 5.60:1
   and 4.53:1. Same warm red-to-amber travel, still legible.
   (We already shipped white-on-gold CTAs at 2.93:1 once — contrast is arithmetic, so compute it.) */
.kbrand{font-style:normal;font-weight:800;
  background:linear-gradient(100deg,#C0341A 0%,#C0491B 45%,#AE6412 100%);
  -webkit-background-clip:text;background-clip:text;color:#C0341A}
@supports (-webkit-background-clip:text) or (background-clip:text){
  .kbrand{color:transparent}   /* only go transparent where the clip actually works */
}
@media (prefers-reduced-motion:no-preference){ .known.bump b{animation:bump 420ms var(--ease)} }
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.35)}100%{transform:scale(1)}}
/* ---------- the panel, redesigned ----------
   Reza: "design the box that opens for suara knows can show the texts better". It was a flat
   bullet list, so eleven equally-weighted lines arrived as a wall. Three changes do the work:
   (1) SPLIT BY MEANING — what is locked in reads completely differently from what is blocked, and
       they were interleaved. Two groups, and the blocked group is the one people remember.
   (2) THE CONSEQUENCE IS THE HEADLINE, the reason is a quiet second line. Before, both were the
       same size and you had to read all of it to find the point.
   (3) A GLYPH PER ROW so the eye can skip — grouping by space, not by rules (better-layout #1). */
.ksec{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:10px;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase;color:#A69A8A}
.ksec:first-child{margin-top:4px}
.ksec::after{content:"";flex:1;height:1px;background:rgba(36,28,21,.09)}
.klist{margin:0;padding:0;list-style:none}
/* the list scrolls, so it needs the same cue the answer area uses — a card sliced flat by the
   button reads as broken, the same fade reads as "there is more". better-layout #5, and the point
   of reusing the exact gradient is that the flow only teaches one signal for hidden content. */
.kwrap{position:relative}
.kwrap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30px;pointer-events:none;
  background:linear-gradient(to top,#FFFDFA,rgba(255,253,250,0));opacity:0;transition:opacity 200ms}
.kwrap.more::after{opacity:1}
.kscroll{max-height:42vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  margin:0 -4px;padding:0 4px 6px}
.kscroll::-webkit-scrollbar{display:none}
.klist li{display:flex;gap:11px;align-items:flex-start;background:#fff;border-radius:14px;
  border:1px solid rgba(36,28,21,.08);padding:11px 12px;margin-bottom:7px;
  box-shadow:0 2px 6px -4px rgba(36,28,21,.3)}
/* ⛔ THESE WERE GREEN AND REZA CALLED IT: "why did u use green icons... how is that a good

<script>

  stetho:'<path d="M6 3v5a5 5 0 0010 0V3"/><path d="M11 13v2a5 5 0 0010 0v-1"/><circle cx="21" cy="12" r="1.6"/>',
  wrench:'<path d="M15.5 3.5a5.5 5.5 0 00-6.9 6.9L3 16v5h5l5.6-5.6a5.5 5.5 0 006.9-6.9l-3.3 3.3-2.8-2.8z"/>',
  arrow:'<path d="M15 19l-7-7 7-7"/>'

const svg = (k, col) => `<svg viewBox="0 0 24 24" fill="none" stroke="${col||'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;

const answers = {};   // screen index -> {text, picked:Set}

function stateFor(k) {
  if (!answers[k]) answers[k] = { text: '', picked: new Set() };
  return answers[k];
}

// Restore what they already said, and record anything they change. Runs on every render, so
// going back shows their own answer rather than an empty field.
// ⛔ `.textContent` turns "Salon or<br>barber" into "Salon orbarber". innerText honours the <br>.
// Take the first line, collapse whitespace, and never let markup line-breaks reach a sentence.
function label(node) {
  // ⛔ This JS lives inside a Python f-string, so a newline escape must be written DOUBLED in the
  // Python source or it becomes a real newline in the output, splits the JS string across two
  // lines, and the WHOLE script fails to parse with "Invalid or unexpected token". The page still
  // renders its static markup, so it looks alive while nothing works.
  // ⭐ The comment that used to sit here explaining this contained the very bug it described: the
  // escape inside it became a real newline, the second half stopped being a comment, and its
  // orphaned backtick opened a template literal that swallowed the next twenty lines of code.
  // Prose about an escaping rule is subject to the escaping rule. Say it in words, not symbols.
  const t = node.querySelector('.oname, .cn, .holname, .tname') || node;
  // JOIN the lines, do not take the first one: "Salon or<br>barber" is one label split across
  // two lines, and keeping only line one produced "we will use the salon or question pack".
  return (t.innerText || t.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 40);
}

function bindState(el, k) {
  const st = stateFor(k);
  if (!st.seeded) {
    st.seeded = true;
    el.querySelectorAll('.tile').forEach((t, n) => { if (t.classList.contains('sel')) st.picked.add(n); });
  }
  el.querySelectorAll('.tile').forEach((t, n) => t.classList.toggle('sel', st.picked.has(n)));
  el.querySelectorAll('[contenteditable]').forEach((f, n) => {
    const key = 'e' + n;

  });

  // toggled the class `on` — but `.chip`, `.opt` and `.holrow` are all styled on `.sel`. So tapping
  // a chip, an option or a calendar row changed a class nobody had written a rule for and produced
  // NO visible change. `.holrow` was not even in the selector list, so the calendar was not
  // clickable at all. Reza asked me to "make it actually work" and half the choice controls did
  // not. My tests never caught it because they only ever clicked `.tile`, which happened to be the
  // one kind that worked — ⭐ a test that exercises one member of a family proves nothing about
  // the family.

  const KINDS = [
    { sel: '.tile',   cls: 'sel', single: true  },
    { sel: '.opt',    cls: 'sel', single: true  },   // a radio: exactly one
    { sel: '.chip',   cls: 'sel', single: false },
    { sel: '.holrow', cls: 'sel', single: false },
    { sel: '.cat',    cls: 'on',  single: false },

  KINDS.forEach(kind => {
    const items = [...el.querySelectorAll(kind.sel)].filter(x => !x.classList.contains('ghost'));
    if (!items.length) return;
    const key = 'p_' + kind.sel;
    if (!st[key]) {
      // seed from whatever the markup shipped as already-chosen, once
      st[key] = new Set(items.map((x, n) => x.classList.contains(kind.cls) ? n : -1).filter(n => n >= 0));

      st.labels = [...st[key]].map(m => label(items[m]));
      refreshKnown(true);
    }));
    if (!st.labels) st.labels = [...st[key]].map(m => label(items[m]));

}

// Screen 0 is the welcome; 1..N-2 are the real questions from screens-data.js; the last is the
// new "make your content" step. S already excludes nothing — its own welcome entry is skipped
// here because this shell renders a better one.
const Q = S.filter(s => !s.welcome);
const LAST = Q.length + 1;

// Each screen now returns its PARTS, not a finished page: the chrome slots are filled by the

// drift — no screen is in a position to render a header of its own.
function welcome() {
  return { btn: 'Get started', body: `<div class="wel">
    <div class="brand anim"><img src="suara-mark.svg" alt=""><b>súara</b></div>
    <div class="stagewrap anim" style="--d:60ms">

      </div>

}

// ⛔ Screen 17's own body carries "STEP 17 OF 17" — the false total, baked into the content

// v3 keeps its one promise: it never states a total, because nobody has measured the real one.
function noTotal(html) {
  return (html || '')
    .replace(/step\s*\d{1,2}\s*of\s*\d{1,2}/gi, '')
    .replace(/tujuh belas soalan/gi, 'Beberapa soalan')
    .replace(/about\s*3\s*minutes?/gi, '');
}

// Two of the category glyphs did not read: a heart for "clinic or aesthetics" and an ambiguous
// wedge for "trades". Swapped for a stethoscope and a wrench, same stroke weight as the rest.
function makeTypeable(html) {
  return (html || '')
    .replace(/<span class="val">([^<]*)<\/span>/g,
      '<span class="val" contenteditable="true" spellcheck="false" data-ph="$1"></span>')
    .replace(/<div class="noteph">([^<]*)<\/div>/g,

// allowed to be the outcome a third time.
const TILEART = {
  'cafe or restaurant': 'cardicons/cafe.png', 'salon or barber': 'cardicons/salon.png',

const TILEICON = {

  'salon or barber':    '<circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M8 8l12 10M20 6L8.6 16"/>',

  'clinic or aesthetics': '<path d="M7 3v5.5a5 5 0 0010 0V3"/><path d="M5.4 3h3.2M13.4 3h3.2"/><path d="M12 13.5v1.4a4 4 0 008 0v-1.2"/><circle cx="20" cy="11.6" r="1.9"/>',
  'shop or product':    '<path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 016 0v2"/>',
  // ⛔ Was an unrecognisable wedge — this is the glyph Reza kept calling truncated. First

  // crop — the hard hat looked correct in the path data and wrong on the screen.
  'trades and home':    '<path d="M3 9.5h18V19a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 19V9.5z"/><path d="M8.5 9.5V7a2 2 0 012-2h3a2 2 0 012 2v2.5"/><path d="M3 14h18"/>',
  'classes or studio':  '<path d="M4 4h7a3 3 0 013 3v13a2.5 2.5 0 00-2.5-2.5H4V4z"/><path d="M20 4h-3a3 3 0 00-3 3v13a2.5 2.5 0 012.5-2.5H20V4z"/>',

window.__iconMisses = [];
const CATART = {
  'Promotional': 'cardicons/cat-promo.png', 'Showcase': 'cardicons/cat-show.png',
  'Brand & story': 'cardicons/cat-brand.png', 'Educational': 'cardicons/cat-edu.png',
  'Social proof': 'cardicons/cat-proof.png', 'Behind the scenes': 'cardicons/cat-bts.png',
  'Timely': 'cardicons/cat-timely.png',
};
window.__catArtMisses = [];
function catArt(root) {
  root.querySelectorAll('.cat').forEach(c => {

function fixIcons(root) {
  root.querySelectorAll('.tile').forEach(t => {
    const svg = t.querySelector('svg'); if (!svg) return;
    const name = ((t.querySelector('.tname') || t).innerText || '').replace(/\s+/g, ' ').trim().toLowerCase();
    const path = TILEICON[name];
    if (!path) { window.__iconMisses.push(name); return; }
    // ⭐ The generated art is the presentation; the inline glyph stays as the FALLBACK and is only
    // hidden once the PNG has actually decoded. If an asset 404s the card still shows a correct
    // icon rather than an empty corner — the art is an upgrade, not a dependency.
    const art = TILEART[name];
    if (art) {
      const img = new Image();
      img.className = 'tart'; img.alt = '';
      img.onload = () => { t.appendChild(img); t.classList.add('hasart'); };
      img.src = art;
    }
    svg.innerHTML = path;                       // keeps whatever stroke colour the tile already set
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke-width', '2.1');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
  });
}

  'The one ask':     st => st.labels?.length && [`Every post pushes toward ${list(st.labels).toLowerCase()}`,

};

function knownFacts() {
  const out = [];
  Q.forEach((s, n) => {
    const st = answers[n + 1]; if (!st) return;
    const f = CONSEQUENCE[s.t] && CONSEQUENCE[s.t](st);
    if (f) out.push({ t: f[0], w: f[1], blocked: !!f[2] });
  });
  if (COLOURS.some((c, n) => c.toLowerCase() !== INIT_COLOURS[n].toLowerCase())) {
    out.push({ t: `Your colours are locked to ${COLOURS.slice(0, 3).join(', ').toUpperCase()}`,
                w: 'Every post we make uses these three' });
  }
  return out;
}

// which glyph goes with which consequence — matched on the sentence we already wrote, so a new
// fact never renders a blank tile
function kicon(x) {
  if (x.blocked) return KICON.no;
  const t = x.t.toLowerCase();
  if (/voice|phrasing|describ/.test(t)) return KICON.voice;
  if (/written for|come in for|face of|appear/.test(t)) return KICON.people;
  if (/scheduled|calendar/.test(t)) return KICON.cal;
  if (/review|praise|quote/.test(t)) return KICON.quote;
  if (/colour|mark goes|signed/.test(t)) return KICON.brush;
  if (/pushes toward|question pack/.test(t)) return KICON.target;
  return KICON.lock;
}

// ---------------------------------------------------------------------------------------------
// COLOUR: the state, the maths, and the branded sheet
// ---------------------------------------------------------------------------------------------
const INIT_COLOURS = ['#E24A28', '#FFC24B', '#1A1520', '#1B3A5C'];
const COLOURS = INIT_COLOURS.slice();          // survives going back and forward
const scrim = document.getElementById('scrim'), sheet = document.getElementById('sheet');

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function hex2hsl(h) {
  const m = /^#?([0-9a-f]{6})$/i.exec(h.trim()); if (!m) return null;
  const n = parseInt(m[1], 16);
  let r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let hu = 0; const l = (mx + mn) / 2;
  const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  if (d) {
    if (mx === r) hu = ((g - b) / d) % 6; else if (mx === g) hu = (b - r) / d + 2; else hu = (r - g) / d + 4;
    hu *= 60; if (hu < 0) hu += 360;
  }
  return { h: Math.round(hu), s: Math.round(s * 100), l: Math.round(l * 100) };
}
function hsl2hex(h, s, l) {
  s /= 100; l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  const t = h < 60 ? [c,x,0] : h < 120 ? [x,c,0] : h < 180 ? [0,c,x]
          : h < 240 ? [0,x,c] : h < 300 ? [x,0,c] : [c,0,x];
  return '#' + t.map(v => Math.round((v + m) * 255).toString(16).padStart(2, '0')).join('');
}

// repaint every place a colour is shown, from the one array. No screen keeps its own copy.
function paintColours(root) {
  const sw = root.querySelector('#swat'), hr = root.querySelector('#hexrow');
  if (sw) [...sw.children].forEach((d, n) => { d.style.background = COLOURS[n]; });
  if (hr) [...hr.children].forEach((s, n) => { s.textContent = COLOURS[n].toUpperCase(); });
  const mock = root.querySelector('#bmock');
  if (mock) {
    mock.style.background = COLOURS[0];
    mock.querySelector('.bbar').style.background = COLOURS[1];
    mock.querySelector('.bln').style.background = COLOURS[2];
  }
}

let sheetIdx = -1, sheetPrev = null;
function closeSheet(restore) {
  if (restore && sheetIdx >= 0 && sheetPrev) COLOURS[sheetIdx] = sheetPrev;
  sheetIdx = -1;
  sheet.classList.remove('on'); scrim.classList.remove('on');
  const scr = stage.querySelector('.scr'); if (scr) paintColours(scr);
}
scrim.addEventListener('click', () => closeSheet(true));

function openSheet(idx) {
  sheetIdx = idx; sheetPrev = COLOURS[idx];
  const c = hex2hsl(COLOURS[idx]) || { h: 0, s: 0, l: 50 };
  sheet.innerHTML = `<div class="cpgrab"></div>
    <h4>${['Your main colour','Your second colour','Your text colour','One more'][idx] || 'Colour'}</h4>
    <p class="shsub">We pulled this from your logo. Change it to whatever is actually yours.</p>
    <div class="cpbig"><div class="cpdot" id="shdot"></div>
      <input class="cphex" id="shhex" maxlength="7" spellcheck="false" inputmode="text"></div>
    <div class="cplab">Hue</div><input class="cpsl" id="shH" type="range" min="0" max="359">
    <div class="cplab">Strength</div><input class="cpsl" id="shS" type="range" min="0" max="100">
    <div class="cplab">Light or dark</div><input class="cpsl" id="shL" type="range" min="6" max="94">
    <div class="cplab">Or pick one</div>
    <div class="cppal" id="shPal">${PALETTE.map(p =>
      `<button data-c="${p}" style="background:${p}" aria-label="${p}"></button>`).join('')}</div>
    <div class="cpfoot"><button id="shCancel">Cancel</button>
      <button class="pri" id="shDone">Use this colour</button></div>`;

  const dot = sheet.querySelector('#shdot'), hexIn = sheet.querySelector('#shhex');
  const H = sheet.querySelector('#shH'), S = sheet.querySelector('#shS'), L = sheet.querySelector('#shL');
  let st = { ...c, exact: COLOURS[idx] };

  // ⛔ Picking #8C6A9E off the palette produced #8C6B9E. Hex → HSL rounds to whole degrees and
  // percents, and converting back cannot recover the original byte. Nobody would spot it, and that
  // is the problem: a brand colour typed from a style guide must come back EXACTLY as typed.
  // ⇒ An exact value is carried through untouched; only moving a slider recomputes from HSL.
  const draw = (typing) => {
    const hexv = st.exact || hsl2hex(st.h, st.s, st.l);
    COLOURS[sheetIdx] = hexv;
    dot.style.background = hexv;
    if (!typing) hexIn.value = hexv.toUpperCase();
    H.value = st.h; S.value = st.s; L.value = st.l;
    // the sliders show what they will DO, not a generic grey track — that is most of "nice"
    H.style.background = 'linear-gradient(90deg,' + [0,60,120,180,240,300,359]
      .map(h => hsl2hex(h, Math.max(st.s, 55), 50)).join(',') + ')';
    S.style.background = `linear-gradient(90deg,${hsl2hex(st.h,0,st.l)},${hsl2hex(st.h,100,st.l)})`;
    L.style.background = `linear-gradient(90deg,#000,${hsl2hex(st.h,st.s,50)},#fff)`;
    sheet.querySelectorAll('#shPal button').forEach(b =>
      b.classList.toggle('on', b.dataset.c.toLowerCase() === hexv.toLowerCase()));
    const scr = stage.querySelector('.scr'); if (scr) paintColours(scr);   // live, behind the sheet
  };
  draw();

  H.addEventListener('input', () => { st.h = +H.value; st.exact = null; draw(); });
  S.addEventListener('input', () => { st.s = +S.value; st.exact = null; draw(); });
  L.addEventListener('input', () => { st.l = +L.value; st.exact = null; draw(); });
  hexIn.addEventListener('input', () => {
    let v = hexIn.value.trim(); if (v[0] !== '#') v = '#' + v;
    const p = hex2hsl(v); if (p) { st = { ...p, exact: v.toLowerCase() }; draw(true); }
  });
  sheet.querySelectorAll('#shPal button').forEach(b => b.addEventListener('click', () => {
    const p = hex2hsl(b.dataset.c); if (p) { st = { ...p, exact: b.dataset.c }; draw(); }
  }));
  sheet.querySelector('#shCancel').addEventListener('click', () => closeSheet(true));
  sheet.querySelector('#shDone').addEventListener('click', () => closeSheet(false));

  scrim.classList.add('on');
  requestAnimationFrame(() => sheet.classList.add('on'));
}

// ---------------------------------------------------------------------------------------------
// VOICE: a prototype recorder. It does not capture audio — it demonstrates the interaction.
// ⛔ Say that out loud rather than letting a demo imply a capability we have not built.
// ---------------------------------------------------------------------------------------------
let vTimer = null;
function wireVoice(el, st) {
  const hero = el.querySelector('#vhero'); if (!hero) return;
  const mic = el.querySelector('#mic'), wave = el.querySelector('#vwave');
  const clock = el.querySelector('#vclock'), hint = el.querySelector('#vhint');
  const sub = el.querySelector('#vsub'), or = el.querySelector('#vor'), note = el.querySelector('#vnote');
  const bars = [...wave.children];
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const idle = () => bars.forEach((b, n) => {
    b.style.height = (14 + 12 * Math.abs(Math.sin(n * 0.9))) + '%';
  });
  let secs = st.voice || 0, running = false;

  const settled = () => {
    hero.classList.remove('vrec'); hero.classList.add('vdone');
    hint.textContent = `Got it — ${fmt(secs)} recorded.`;
    sub.textContent = 'Tap the button to record it again.';
    clock.textContent = fmt(secs);
  };
  const stop = () => {
    running = false; clearInterval(vTimer); vTimer = null;
    st.voice = secs; secs ? settled() : reset();
  };
  const reset = () => {
    hero.classList.remove('vrec', 'vdone'); idle();
    hint.textContent = 'Tap and just talk.';
    sub.textContent = 'Twenty seconds is plenty. Say it how you would at a wedding.';
    clock.textContent = '0:00';
  };

  idle();
  if (st.voice) settled();

  mic.addEventListener('click', () => {
    if (running) return stop();
    secs = 0; running = true;
    hero.classList.add('vrec'); hero.classList.remove('vdone');
    hint.textContent = 'Listening — tap to stop.';
    sub.textContent = 'Say it once, the way you actually say it.';
    vTimer = setInterval(() => {
      secs++; clock.textContent = fmt(secs);
      // a waveform that does not move during recording reads as broken
      bars.forEach(b => { b.style.height = (18 + Math.random() * 76) + '%'; });
      if (secs >= 30) stop();
    }, 260);
  });

  or.addEventListener('click', () => {
    const typing = !note.hidden;
    note.hidden = typing;
    or.textContent = typing ? 'or type it instead' : 'or record it instead';
    if (!typing) note.querySelector('[contenteditable]').focus();
  });
  if (st.e0) { note.hidden = false; or.textContent = 'or record it instead'; }
}

// ⛔ These listeners used to be registered INSIDE render(), once per screen, and never removed —
// after twenty steps there were twenty of them, each holding a detached element alive. One
// listener that calls whatever the current screen's refit is.
let currentRefit = () => {};
const typing = () => document.activeElement &&
  document.activeElement.matches('[contenteditable],input,textarea');
addEventListener('resize', () => currentRefit());
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => {
  // ⛔ On iOS the keyboard opening IS a visualViewport resize. Refitting then measures against a
  // half-covered screen and shrinks everything to the floor mid-sentence. Never re-fit while
  // they are typing — the layout they are looking at must not move under their hands.
  if (!typing()) currentRefit();
});

function render(rev) {
  // ⛔ A setInterval left running on a screen you have left keeps writing into detached nodes and
  // keeps counting. Kill it before the screen goes, not in a cleanup that may never run.
  if (vTimer) { clearInterval(vTimer); vTimer = null; }
  if (sheetIdx >= 0) closeSheet(false);
  const old = stage.querySelector('.scr');
  if (old) {
    old.classList.remove('in'); old.classList.add('out');
    // ⛔ 170ms, not 20ms: an earlier build stripped the class before the out-animation finished,
    // so under reduced motion the fade never completed and the screen snapped.
    setTimeout(() => old.remove(), reduce ? 0 : 230);
  }

  const p = i === 0 ? welcome() : (i === LAST ? create() : question(Q[i - 1]));

  // ---- chrome: filled, never rebuilt, never scaled ----
  navrow.hidden = (i === 0);
  backBtn.hidden = (i === 0);
  // the nav row now carries the live "knows" pill instead of a label repeating the question
  headEl.innerHTML = (p.eb || p.h || p.sub)
    ? `<div class="eyebrow anim" style="--d:0ms">${p.eb || ''}</div>
       <h1 class="anim" style="--d:30ms">${p.h || ''}</h1>
       ${p.sub ? `<div class="sub anim" style="--d:60ms">${p.sub}</div>` : ''}`
    : '';
  goBtn.innerHTML = p.btn || 'Continue';
  goBtn.classList.toggle('accent', !!p.accent);
  skipBtn.innerHTML = p.skip || '';
  skipBtn.classList.toggle('ghost', !p.skip);
  // replay the title motion in place. Only the head animates: a nav row and a button that hold
  // perfectly still while the question changes are what make the flow feel like one screen you
  // are moving through rather than a deck of slides.
  headEl.classList.remove('chrome-in', 'rev'); void headEl.offsetWidth;
  headEl.classList.add('chrome-in'); if (rev) headEl.classList.add('rev');

  const el = document.createElement('div');
  el.className = 'scr pre' + (rev ? ' rev' : '');
  const fit = document.createElement('div');
  fit.className = 'fit';
  fit.innerHTML = p.body;
  el.appendChild(fit);
  if (i === LAST && !answers[LAST]) {
    const st = stateFor(LAST);
    el.querySelectorAll('.cat').forEach((c, n) => { if (c.classList.contains('on')) st.picked.add(n); });
  }
  stage.appendChild(el);

  // measure, then scale only if it genuinely does not fit. Width is compensated so a scaled
  // screen still fills the shell rather than leaving rails down each side.
  // ⛔ Measuring once in rAF was too early: the photo grid and the first-week grid load their
  // images afterwards, so `need` was computed against a shorter box and those two screens kept
  // overflowing. Re-fit whenever an image lands, whenever the box changes, and on resize.
  function refit() {
    // ⛔ On iOS Safari 100dvh includes the strip under the toolbar, so el.clientHeight is LARGER
    // than what you can actually see — the fit concluded there was room and the Continue button
    // ended up on top of the content on Reza's phone while every headless size passed. Measure
    // against visualViewport, which is the genuinely visible area.
    const vv = window.visualViewport;
    const avail = Math.min(el.clientHeight, vv ? vv.height : el.clientHeight);
    // ⛔ The width compensation was self-defeating and caused an oscillation: widening the box to
    // 100/k% re-wrapped the text TALLER, so the next measure produced a different need and the
    // scale never converged (measured: 755 unscaled vs 859 scaled, settling at the wrong k).
    // Scale only. A narrower column at small sizes is a cosmetic cost; a scrollbar is not allowed.
    fit.style.transform = 'none';
    el.classList.remove('scrolls'); stage.classList.remove('hasScroll');
    // with a natural-height column, offsetHeight is finally the truth
    const need = fit.offsetHeight;
    const ratio = avail / need;
    // ⭐ 0.90, not 0.45. A 10% nudge is invisible and keeps a screen whole; anything more was the
    // thing Reza could see. Past that we stop pretending and scroll the answer list instead —
    // scaling and scrolling are never mixed, so the type is either 90–100% or exactly 100%.
    if (need <= avail + 1) { lastScale = 1; }
    else if (ratio >= 0.90) { fit.style.transform = `scale(${ratio})`; lastScale = ratio; }
    else {
      lastScale = 1;
      el.classList.add('scrolls'); stage.classList.add('hasScroll');
    }
  }
  currentRefit = refit;
  // measure, scale, and only then reveal — this is what removed the snap
  // fit twice while still invisible (fonts and images can settle between the two), then reveal.
  // Nothing re-scales after this point, so there is no jump to see.
  const reveal = () => { el.classList.remove('pre'); el.classList.add('in'); };
  const imgs = [...fit.querySelectorAll('img')].filter(im => !im.complete);
  Promise.all(imgs.map(im => new Promise(r => {
    im.addEventListener('load', r, { once: true }); im.addEventListener('error', r, { once: true });
  }))).then(() => requestAnimationFrame(() => {
    refit();
    requestAnimationFrame(() => { refit(); requestAnimationFrame(reveal); });
  }));
  if (!imgs.length) requestAnimationFrame(() => {
    refit(); requestAnimationFrame(() => { refit(); requestAnimationFrame(reveal); });
  });
  fit.querySelectorAll('img').forEach(img => {
    if (!img.complete) img.addEventListener('load', refit, { once: true });
    img.addEventListener('error', refit, { once: true });
  });
  // no total is shown anywhere — position only. The flow is 29 screens and used to claim 17.
  fill.style.width = Math.round((i / LAST) * 100) + '%';

  // ⛔ The chrome buttons persist across screens, so addEventListener would stack a new handler
  // every step and one tap would jump several screens. Assign, don't add.
  goBtn.onclick   = () => { if (i < LAST) { i++; render(false); } };
  skipBtn.onclick = () => { if (i < LAST) { i++; render(false); } };
  backBtn.onclick = () => { if (i > 0) { i--; render(true); } };
  bindState(el, i);
  // the two rebuilt screens. paintColours runs on EVERY render, not just the colour screen, so a
  // colour changed and then revisited shows the change rather than the value baked into the markup.
  paintColours(el);
  el.querySelectorAll('#swat > div').forEach((d, n) => d.addEventListener('click', () => openSheet(n)));
  fixIcons(el);            // swap category glyphs on the live DOM, by name, and record misses
  catArt(el);
  wireVoice(el, stateFor(i));
  refreshKnown(false);
  knownBtn.onclick = openKnown;
  el.querySelectorAll('.lang button').forEach(x => x.addEventListener('click', () => {
    el.querySelectorAll('.lang button').forEach(y => y.classList.remove('on'));
    x.classList.add('on');
  }));
}
render(false);
</script></body></html>
