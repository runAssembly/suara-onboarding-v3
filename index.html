<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suara onboarding v3</title>
<!-- BUILDSTAMP chrome-outside-stage-r1 — a string written in THIS build. The deploy probe greps
     for this, not for "the page loads": a reachable page that serves the PREVIOUS build passes a
     liveness check and tells you nothing. Bump it whenever the build changes materially. -->
<link rel="stylesheet" href="flow-shared.css">
<style>
:root{
  --t-in:300ms; --t-out:220ms;
  --travel:22px; --stagger:32ms; --t-prog:520ms;
  --ease:cubic-bezier(.22,.61,.24,1);
}
*{box-sizing:border-box}
/* Reza: "this is going to be used through a browser" + "everything always stays in one screen".
   So: no fake phone chrome, no page scroll ever, and the whole thing sized off dvh so mobile
   browser chrome appearing/disappearing cannot introduce a scrollbar. Everything below scales
   with --u, one unit derived from the actual viewport, so a 640px-tall laptop window and a
   900px-tall one both fit without a scrollbar rather than only the tall one fitting. */
html,body{height:100%;overflow:hidden}
body{margin:0;background:#FBF4EA;font-family:PJS,ui-sans-serif,system-ui,sans-serif;
  display:flex;justify-content:center;
  --u:clamp(.72px, .1vh + .05vw, 1.06px);}
.shell{width:min(460px,100%);height:100dvh;background:#FBF4EA;overflow:hidden;position:relative;
  display:flex;flex-direction:column}
@media (min-width:900px){
  body{background:#EFE7DA;align-items:center}
  .shell{height:min(920px,96dvh);border-radius:30px;
    box-shadow:0 40px 90px -50px rgba(60,40,25,.55);border:1px solid rgba(36,28,21,.08)}
}
/* ⛔⛔ THE CHROME USED TO LIVE INSIDE THE SCALED BOX. Reza, 23 Aug: "its making different pages
   inconsistent with their header sizes and other components". He was right, and it was structural.
   Every screen rendered its own nav row, its own title block and its own button INSIDE `.fit`, and
   `.fit` gets a per-screen scale so it fits. So a content-heavy screen scaled to 0.85 and shrank
   its own header, while the next screen sat at 1.0 — measured: nav row 52px tall on one screen and
   44px on the next, sitting at different heights on the page. No amount of tuning fixes that,
   because the header was downstream of how much CONTENT the screen happened to have.
   ⇒ The bar, the nav row, the title block and the button are now SHELL chrome. They are rendered
   once, they live outside `.stage`, and they are never scaled. The only thing that can flex is the
   answer area. The headers are now identical across screens BY CONSTRUCTION rather than because a
   test says so — a whole class of bug is gone rather than guarded. (better-layout #8: sticky chrome
   floats above the content layer, it doesn't dam it.) */
.stage{position:relative;flex:1;overflow:hidden;min-height:0}
.scr{position:absolute;inset:0;overflow:hidden}
/* ⭐⭐ THE NO-SCROLL RULE, RESTATED HONESTLY. Measured 23 Aug: on an iPhone the answer area is
   ~340px and eleven of the nineteen screens hold 400–920px of content. "Never scroll" was
   therefore being delivered by shrinking — down to 60% on the first-week screen — and shrinking is
   exactly what made the pages look inconsistent to Reza. You cannot fit 920px into 340px; you can
   only lie about it.
   ⇒ The promise that is worth keeping is the one he actually cares about: THE QUESTION, THE ANSWER
   AND THE BUTTON ARE ALWAYS VISIBLE, AT THE SAME SIZE, ON EVERY SCREEN. That is now guaranteed by
   the chrome living outside the stage. Below 90% we stop shrinking and let the ANSWER LIST scroll
   inside its own box — never the page, never the header, never the button. A list of seven
   categories that scrolls is normal; a page rendered at 60% is not. */
.scr.scrolls{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  scrollbar-width:none}
.scr.scrolls::-webkit-scrollbar{display:none}
.scr.scrolls .fit{position:relative;min-height:0}
/* better-layout #5: hidden content needs a visible cue, or it may as well not exist */
.stage.hasScroll::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;
  background:linear-gradient(to top,#FBF4EA,rgba(251,244,234,0));pointer-events:none;z-index:4}
.fit{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;
  min-height:100%;transform-origin:top center;will-change:transform}
/* natural height — never squashed, so nothing can spill under the footer */
.scr .body{flex:1 0 auto;min-height:0}

/* container fades, children translate — split across DOM levels so it reads as one soft object */
/* held invisible until it has been measured and scaled — nothing animates before it fits */
.scr.pre{opacity:0}
/* ⛔⛔ THE BUG BEHIND "the back button breaks everything". The direction marker on the screen was
   `.back` — the SAME class name as the back BUTTON. So pressing back put `class="scr back"` on the
   screen, which picked up the button's rules: width:34px, height:34px, border-radius:50%,
   display:grid. The screen became a circle the size of a button, its content reflowed into a
   sliver, and the fit maths measured 1073px of content into 34px of space and clamped to the 0.45
   floor. Every back press, every screen, not intermittent — the probe caught all eight.
   The direction modifier is now `.rev`. `.back` means the button and nothing else. */
@media (prefers-reduced-motion:no-preference){
  .scr.in{animation:fade var(--t-in) var(--ease) both}
  .scr.in .anim{animation:rise var(--t-in) var(--ease) both;animation-delay:var(--d,0ms)}
  .scr.out{animation:fadeOut var(--t-out) var(--ease) both}
  .scr.in.rev .anim{animation-name:riseBack}
  /* the chrome text swaps in place with the same motion, so the header reads as one steady object
     whose label changes rather than a header that is rebuilt every step */
  .chrome-in .anim{animation:rise var(--t-in) var(--ease) both;animation-delay:var(--d,0ms)}
  .chrome-in.rev .anim{animation-name:riseBack}
}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* the outgoing screen drifts a little and dims rather than cutting — it overlaps the incoming
   one, which is what makes a step feel continuous instead of like two slides */
@keyframes fadeOut{from{opacity:1;transform:translateX(0)}
  to{opacity:0;transform:translateX(calc(var(--travel) * -0.45))}}
/* rise, not slide: a small vertical lift with a touch of horizontal reads softer than a pure
   sideways push, and it does not fight the fit transform on the parent */
@keyframes rise{from{opacity:0;transform:translate3d(calc(var(--travel) * .5), 10px, 0)}
  to{opacity:1;transform:none}}
@keyframes riseBack{from{opacity:0;transform:translate3d(calc(var(--travel) * -.5), 10px, 0)}
  to{opacity:1;transform:none}}

.bar{height:3px;background:rgba(36,28,21,.09);position:relative;flex:none}
.bar i{position:absolute;inset:0 auto 0 0;background:#E1552E;border-radius:0 3px 3px 0;
  transition:width var(--t-prog) var(--ease)}
.navrow{display:flex;align-items:center;gap:12px;padding:14px 20px 4px;flex:none}
/* our own display:flex beats the UA [hidden] rule, so say it explicitly or the welcome screen
   keeps a phantom nav row */
.navrow[hidden],.foot[hidden]{display:none}
.back{width:34px;height:34px;border-radius:50%;border:1px solid rgba(36,28,21,.14);background:#fff;
  display:grid;place-items:center;cursor:pointer;color:#241C15;-webkit-appearance:none;appearance:none;
  padding:0;transition:opacity 160ms,transform 160ms}
.back svg{width:17px;height:17px;stroke:#241C15}
.back[hidden]{opacity:0;pointer-events:none}
.back:active{transform:scale(.94)}
.pos{margin-left:auto;font-size:12.5px;color:#A69A8A;font-weight:600;letter-spacing:.02em}

/* the title block is CHROME, not content: same place, same size, on every question. Only its
   words change. This is the half of the fix that Reza actually sees. */
.head{padding:calc(2*var(--u)) calc(24*var(--u)) 0;flex:none}
.head:empty{display:none}
.body{padding:calc(12*var(--u)) calc(24*var(--u)) calc(14*var(--u))}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#E1552E;
  margin-bottom:10px}
h1{font-size:clamp(17px, calc(27*var(--u)), 29px);line-height:1.14;letter-spacing:-.02em;color:#241C15;margin:0 0 8px;font-weight:700}
.sub{font-size:clamp(13px, calc(15*var(--u)), 16px);line-height:1.5;color:#7C7062;margin:0}
/* ⭐ The skip row is ALWAYS in the DOM and only its visibility changes. If it were added and
   removed the footer would be two different heights, the content area would jump by ~30px between
   steps, and we would be back to the inconsistency he complained about — just in a subtler place
   that a screenshot would not obviously show. Reserve the space. */
.foot{padding:calc(10*var(--u)) calc(24*var(--u)) calc(20*var(--u));flex:none}
.skip.ghost{visibility:hidden;pointer-events:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:#241C15;color:#fff;
  border:0;width:100%;padding:calc(15*var(--u));border-radius:100px;font:inherit;
  font-size:clamp(14px, calc(16*var(--u)), 17px);font-weight:700;
  cursor:pointer;transition:transform 140ms var(--ease),filter 140ms}
.btn:active{transform:scale(.985)}
.btn.accent{background:#E1552E}
.skip{display:block;width:100%;text-align:center;margin-top:12px;background:none;border:0;
  color:#A69A8A;font:inherit;font-size:13.5px;cursor:pointer}

/* ---------- welcome (Bob's direction, three faults fixed) ---------- */
.wel{position:relative;flex:1;display:flex;flex-direction:column;padding:26px 26px 0}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand img{width:38px;height:38px;border-radius:11px}
.brand b{font-size:25px;color:#E1552E;letter-spacing:-.02em}
/* FIX 1: the pills were colliding with each other and with the cards. They are now a laid-out
   row above the stack and a single anchored tag below it — nothing floats. */
.stagewrap{position:relative;margin:auto 0 6px;flex:none}
.pill{background:#fff;border:1px solid rgba(36,28,21,.08);border-radius:100px;padding:7px 14px;
  font-size:12.5px;font-weight:700;color:#241C15;box-shadow:0 6px 18px -12px rgba(60,40,25,.5);
  display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill.ok{color:#2F6B3D}
.pill svg{width:14px;height:14px;flex:none;opacity:.75}
.pill.ok svg{opacity:1}
.stack{position:relative;height:clamp(118px, calc(212*var(--u)), 230px);display:grid;place-items:center}
.pin{position:absolute;z-index:3}
/* Bob's positions. They overlap the CARDS on purpose — that is the depth — but the 2x rule from
   better-layout means they must never overlap each OTHER, which is where his collided. */
.pin.a{top:-6px;left:50%;transform:translateX(-58%)}
.pin.b{bottom:24px;left:-4px}
.pin.c{bottom:52px;right:-4px}
.pin.d{bottom:-14px;left:50%;transform:translateX(-30%)}
.stack img{position:absolute;width:calc(126*var(--u));height:calc(158*var(--u));object-fit:cover;
  border-radius:14px;
  border:4px solid #fff;box-shadow:0 18px 40px -22px rgba(60,40,25,.55)}
.stack img:nth-child(1){transform:rotate(-9deg) translateX(-88px)}
.stack img:nth-child(2){transform:rotate(4deg) translateX(88px)}
.stack img:nth-child(3){width:calc(150*var(--u));height:calc(186*var(--u));z-index:2}
/* FIX 2: the dead gap between the pills and the headline is closed — the copy block starts
   directly under the stack instead of 200px below it. */
.welcopy{margin-top:28px;margin-bottom:auto}
.welcopy h1{font-size:clamp(25px, calc(41*var(--u)), 46px);line-height:1.02;
  letter-spacing:-.035em;margin-bottom:calc(9*var(--u))}
/* FIX 3: the count is stated ONCE, in the pill. The sentence says what it is, not how many. */
.welcopy p{font-size:15.5px;line-height:1.5;color:#7C7062;margin:0}
.lang{display:flex;gap:10px;margin:18px 0 0}
.lang button{flex:1;padding:14px;border-radius:100px;border:1px solid rgba(36,28,21,.12);
  background:#fff;font:inherit;font-size:14.5px;font-weight:700;color:#241C15;cursor:pointer;
  transition:background 160ms,color 160ms,border-color 160ms}
.lang button.on{background:#E1552E;border-color:#E1552E;color:#fff}

/* ---------- the new final screen ---------- */
[contenteditable],input,textarea,select{outline:none;font-size:16px}
[contenteditable]:empty::before{content:attr(data-ph);color:#B6AC9E}
[contenteditable]:focus{box-shadow:0 0 0 2px rgba(225,85,46,.22);border-radius:6px}
.cats{display:flex;flex-direction:column;gap:calc(7*var(--u));margin-top:calc(3*var(--u))}
.cat{display:grid;grid-template-columns:22px 1fr;grid-template-rows:auto auto;gap:2px 12px;
  text-align:left;background:#fff;border:1px solid rgba(36,28,21,.1);border-radius:15px;
  padding:calc(11*var(--u)) calc(14*var(--u));font:inherit;cursor:pointer;
  transition:border-color 160ms var(--ease),background 160ms var(--ease)}
/* flow-shared.css styles a .tick of its own (green, filled) and it was bleeding through, so
   unticked boxes rendered as solid green — reading as "already on". Reset explicitly. */
.cat .tick{grid-row:1/3;width:22px;height:22px;border-radius:7px;
  border:1.5px solid rgba(36,28,21,.2)!important;background:#fff!important;
  align-self:center;position:relative;box-shadow:none!important;
  transition:background 160ms,border-color 160ms}
.cat .tick::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);
  transition:transform 160ms var(--ease)}
.cat.on{border-color:#E1552E;background:#FDF0EA}
.cat.on .tick{background:#E1552E!important;border-color:#E1552E!important}
.cat.on .tick::after{transform:rotate(45deg) scale(1)}
.cn{font-size:15px;font-weight:700;color:#241C15}
.cd{font-size:13px;color:#7C7062;grid-column:2}
.note{margin-top:14px;font-size:13px;color:#A69A8A;line-height:1.5}

/* ---------- density ----------
   Ten of nineteen screens needed an internal scroll on an iPhone, and the single biggest cause was
   the option row: a 38px glyph inside 14px of padding is a 77px row, so four choices ate 308px of
   a 356px answer area before the question was even counted. Tightened to ~52px, which is still
   well above a 44px touch target and gets most screens back to fitting outright. Overridden here
   rather than in flow-shared.css because the other prototypes still render against that file. */
.opts{margin-top:10px;gap:7px}
.opt{padding:10px 13px;gap:11px}
.opt.sel{padding:9px 12px}
.glyph{width:30px;height:30px;border-radius:10px}
.glyph svg{width:16px;height:16px}
.odesc{margin-top:1px}
.tile{min-height:78px;padding:12px 12px}
.chips{margin-top:10px;gap:7px}
.sm{margin-top:8px}
</style></head><body>
<div class="shell">
  <div class="bar"><i id="fill" style="width:0%"></i></div>
  <div class="navrow" id="navrow"><button class="back" id="back" aria-label="Back"></button>
    <span class="pos" id="pos"></span></div>
  <div class="head" id="head"></div>
  <div class="stage" id="stage"></div>
  <div class="foot" id="foot"><button class="btn" id="go">Continue</button>
    <button class="skip ghost" id="skip"></button></div>
</div>

<script src="screens-data.js"></script>
<script>
const CATS_HTML = `<button class="cat" data-cat="Promotional"><span class="tick" aria-hidden="true"></span><span class="cn">Promotional</span><span class="cd">Offers, what's new, book or buy now</span></button><button class="cat on" data-cat="Showcase"><span class="tick" aria-hidden="true"></span><span class="cn">Showcase</span><span class="cd">Your products, dishes or services</span></button><button class="cat on" data-cat="Brand &amp; story"><span class="tick" aria-hidden="true"></span><span class="cn">Brand &amp; story</span><span class="cd">Your vibe, values, who you are</span></button><button class="cat" data-cat="Educational"><span class="tick" aria-hidden="true"></span><span class="cn">Educational</span><span class="cd">Tips, how it works, know-how</span></button><button class="cat on" data-cat="Social proof"><span class="tick" aria-hidden="true"></span><span class="cn">Social proof</span><span class="cd">Reviews, results, what people say</span></button><button class="cat" data-cat="Behind the scenes"><span class="tick" aria-hidden="true"></span><span class="cn">Behind the scenes</span><span class="cd">The people and the making</span></button><button class="cat" data-cat="Timely"><span class="tick" aria-hidden="true"></span><span class="cn">Timely</span><span class="cd">Seasonal, local, events</span></button>`;

const IC = {
  grid:'<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>',
  lock:'<rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 018 0v3.5"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 2.6v4.2M16 2.6v4.2M3.5 10h17"/>',
  check:'<path d="M4.5 12.5l5 5 10-11"/>',
  stetho:'<path d="M6 3v5a5 5 0 0010 0V3"/><path d="M11 13v2a5 5 0 0010 0v-1"/><circle cx="21" cy="12" r="1.6"/>',
  wrench:'<path d="M15.5 3.5a5.5 5.5 0 00-6.9 6.9L3 16v5h5l5.6-5.6a5.5 5.5 0 006.9-6.9l-3.3 3.3-2.8-2.8z"/>',
  arrow:'<path d="M15 19l-7-7 7-7"/>'
};
const svg = (k, col) => `<svg viewBox="0 0 24 24" fill="none" stroke="${col||'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage'), fill = document.getElementById('fill');
const navrow = document.getElementById('navrow'), headEl = document.getElementById('head');
const posEl = document.getElementById('pos'), goBtn = document.getElementById('go');
const skipBtn = document.getElementById('skip'), backBtn = document.getElementById('back');
backBtn.innerHTML = svg('arrow');
let i = 0, lastScale = 1;
const answers = {};   // screen index -> {text, picked:Set}

function stateFor(k) {
  if (!answers[k]) answers[k] = { text: '', picked: new Set() };
  return answers[k];
}

// Restore what they already said, and record anything they change. Runs on every render, so
// going back shows their own answer rather than an empty field.
function bindState(el, k) {
  const st = stateFor(k);
  if (!st.seeded) {
    st.seeded = true;
    el.querySelectorAll('.tile').forEach((t, n) => { if (t.classList.contains('sel')) st.picked.add(n); });
  }
  el.querySelectorAll('.tile').forEach((t, n) => t.classList.toggle('sel', st.picked.has(n)));
  el.querySelectorAll('[contenteditable]').forEach((f, n) => {
    const key = 'e' + n;
    if (st[key]) f.textContent = st[key];
    f.addEventListener('input', () => { st[key] = f.textContent.trim(); });
  });
  // tiles, chips and category cards all behave the same: tap to choose, choice persists
  el.querySelectorAll('.tile, .chip, .cat, .opt').forEach((c, n) => {
    const single = c.classList.contains('tile');
    if (st.picked.has(n)) c.classList.add(single ? 'sel' : 'on');
    c.addEventListener('click', () => {
      if (single) {
        el.querySelectorAll('.tile').forEach((o, m) => { o.classList.remove('sel'); st.picked.delete(m); });
        c.classList.add('sel'); st.picked.add(n);
      } else {
        c.classList.toggle('on'); st.picked.has(n) ? st.picked.delete(n) : st.picked.add(n);
      }
    });
  });
}

// Screen 0 is the welcome; 1..N-2 are the real questions from screens-data.js; the last is the
// new "make your content" step. S already excludes nothing — its own welcome entry is skipped
// here because this shell renders a better one.
const Q = S.filter(s => !s.welcome);
const LAST = Q.length + 1;

// Each screen now returns its PARTS, not a finished page: the chrome slots are filled by the
// shell, and only `body` is mounted into the stage. That is what makes the header impossible to
// drift — no screen is in a position to render a header of its own.
function welcome() {
  return { btn: 'Get started', body: `<div class="wel">
    <div class="brand anim"><img src="suara-mark.svg" alt=""><b>súara</b></div>
    <div class="stagewrap anim" style="--d:60ms">
      <div class="stack">
        <img src="p2.jpg" alt=""><img src="p3.jpg" alt=""><img src="p1.jpg" alt="">
      </div>
      <span class="pill pin a">${svg('grid')}12 posts &middot; 4 stories</span>
      <span class="pill pin b">${svg('lock')}Brand locked</span>
      <span class="pill pin c">${svg('cal')}Tue &middot; 8:00am</span>
      <span class="pill pin d ok">${svg('check','#2F6B3D')}Approved</span>
    </div>
    <div class="welcopy anim" style="--d:120ms">
      <h1>Your week of<br>posts, done.</h1>
      <p>Finished posts and stories every month, in your own brand and voice. You just approve.</p>
      <div class="lang">
        <button class="on">Bahasa Melayu</button><button>English</button>
      </div>
    </div>
  </div>` };
}

// ⛔ Screen 17's own body carries "STEP 17 OF 17" — the false total, baked into the content
// rather than the shell. Caught by walking the flow, not by reading the shell. Stripped here so
// v3 keeps its one promise: it never states a total, because nobody has measured the real one.
function noTotal(html) {
  return (html || '')
    .replace(/step\s*\d{1,2}\s*of\s*\d{1,2}/gi, '')
    .replace(/tujuh belas soalan/gi, 'Beberapa soalan')
    .replace(/about\s*3\s*minutes?/gi, '');
}

// Two of the category glyphs did not read: a heart for "clinic or aesthetics" and an ambiguous
// wedge for "trades". Swapped for a stethoscope and a wrench, same stroke weight as the rest.
function makeTypeable(html) {
  return (html || '')
    .replace(/<span class="val">([^<]*)<\/span>/g,
      '<span class="val" contenteditable="true" spellcheck="false" data-ph="$1"></span>')
    .replace(/<div class="noteph">([^<]*)<\/div>/g,
      '<div class="noteph" contenteditable="true" spellcheck="false" data-ph="$1"></div>');
}

function fixIcons(html) {
  return (html || '')
    .replace(/<path d="M20\.8 [^"]*"\/>|<path d="M12 21[^"]*"\/>/g, IC.stetho)
    .replace(/<path d="M14\.7 6\.3[^"]*"\/>/g, IC.wrench);
}

function question(s) {
  return {
    pos: s.t || '',
    eb:  noTotal(s.eb),
    h:   noTotal(s.h),
    sub: noTotal(s.sub),
    btn: noTotal(s.btn) || 'Continue',
    skip: s.skip || '',
    body: `<div class="body"><div class="anim" style="--d:40ms">${
      makeTypeable(fixIcons(noTotal(s.body)))}</div></div>`,
  };
}

function create() {
  return {
    pos: '', eb: 'Last one',
    h: "Now let's make<br>your first week.",
    sub: "We've ticked a good opening mix. Change it if you want — or leave it and we'll get on with it.",
    btn: 'Make my week', accent: true, skip: 'Just run a good mix',
    body: `<div class="body">
      <div class="cats anim" style="--d:40ms">${CATS_HTML}</div>
      <p class="note anim" style="--d:80ms">You approve everything before it goes anywhere.
        Nothing posts by itself.</p>
    </div>`,
  };
}

// ⛔ These listeners used to be registered INSIDE render(), once per screen, and never removed —
// after twenty steps there were twenty of them, each holding a detached element alive. One
// listener that calls whatever the current screen's refit is.
let currentRefit = () => {};
const typing = () => document.activeElement &&
  document.activeElement.matches('[contenteditable],input,textarea');
addEventListener('resize', () => currentRefit());
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => {
  // ⛔ On iOS the keyboard opening IS a visualViewport resize. Refitting then measures against a
  // half-covered screen and shrinks everything to the floor mid-sentence. Never re-fit while
  // they are typing — the layout they are looking at must not move under their hands.
  if (!typing()) currentRefit();
});

function render(rev) {
  const old = stage.querySelector('.scr');
  if (old) {
    old.classList.remove('in'); old.classList.add('out');
    // ⛔ 170ms, not 20ms: an earlier build stripped the class before the out-animation finished,
    // so under reduced motion the fade never completed and the screen snapped.
    setTimeout(() => old.remove(), reduce ? 0 : 230);
  }

  const p = i === 0 ? welcome() : (i === LAST ? create() : question(Q[i - 1]));

  // ---- chrome: filled, never rebuilt, never scaled ----
  navrow.hidden = (i === 0);
  backBtn.hidden = (i === 0);
  // ⛔ textContent, not innerHTML, printed "Skip &mdash; I will come back to this" verbatim on
  // screen 5. The source copy contains HTML entities; textContent does not decode them. Caught in
  // a screenshot, not by any assertion — so the entity check below now runs on every screen.
  posEl.innerHTML = p.pos || '';
  headEl.innerHTML = (p.eb || p.h || p.sub)
    ? `<div class="eyebrow anim" style="--d:0ms">${p.eb || ''}</div>
       <h1 class="anim" style="--d:30ms">${p.h || ''}</h1>
       ${p.sub ? `<div class="sub anim" style="--d:60ms">${p.sub}</div>` : ''}`
    : '';
  goBtn.innerHTML = p.btn || 'Continue';
  goBtn.classList.toggle('accent', !!p.accent);
  skipBtn.innerHTML = p.skip || '';
  skipBtn.classList.toggle('ghost', !p.skip);
  // replay the title motion in place. Only the head animates: a nav row and a button that hold
  // perfectly still while the question changes are what make the flow feel like one screen you
  // are moving through rather than a deck of slides.
  headEl.classList.remove('chrome-in', 'rev'); void headEl.offsetWidth;
  headEl.classList.add('chrome-in'); if (rev) headEl.classList.add('rev');

  const el = document.createElement('div');
  el.className = 'scr pre' + (rev ? ' rev' : '');
  const fit = document.createElement('div');
  fit.className = 'fit';
  fit.innerHTML = p.body;
  el.appendChild(fit);
  if (i === LAST && !answers[LAST]) {
    const st = stateFor(LAST);
    el.querySelectorAll('.cat').forEach((c, n) => { if (c.classList.contains('on')) st.picked.add(n); });
  }
  stage.appendChild(el);

  // measure, then scale only if it genuinely does not fit. Width is compensated so a scaled
  // screen still fills the shell rather than leaving rails down each side.
  // ⛔ Measuring once in rAF was too early: the photo grid and the first-week grid load their
  // images afterwards, so `need` was computed against a shorter box and those two screens kept
  // overflowing. Re-fit whenever an image lands, whenever the box changes, and on resize.
  function refit() {
    // ⛔ On iOS Safari 100dvh includes the strip under the toolbar, so el.clientHeight is LARGER
    // than what you can actually see — the fit concluded there was room and the Continue button
    // ended up on top of the content on Reza's phone while every headless size passed. Measure
    // against visualViewport, which is the genuinely visible area.
    const vv = window.visualViewport;
    const avail = Math.min(el.clientHeight, vv ? vv.height : el.clientHeight);
    // ⛔ The width compensation was self-defeating and caused an oscillation: widening the box to
    // 100/k% re-wrapped the text TALLER, so the next measure produced a different need and the
    // scale never converged (measured: 755 unscaled vs 859 scaled, settling at the wrong k).
    // Scale only. A narrower column at small sizes is a cosmetic cost; a scrollbar is not allowed.
    fit.style.transform = 'none';
    el.classList.remove('scrolls'); stage.classList.remove('hasScroll');
    // with a natural-height column, offsetHeight is finally the truth
    const need = fit.offsetHeight;
    const ratio = avail / need;
    // ⭐ 0.90, not 0.45. A 10% nudge is invisible and keeps a screen whole; anything more was the
    // thing Reza could see. Past that we stop pretending and scroll the answer list instead —
    // scaling and scrolling are never mixed, so the type is either 90–100% or exactly 100%.
    if (need <= avail + 1) { lastScale = 1; }
    else if (ratio >= 0.90) { fit.style.transform = `scale(${ratio})`; lastScale = ratio; }
    else {
      lastScale = 1;
      el.classList.add('scrolls'); stage.classList.add('hasScroll');
    }
  }
  currentRefit = refit;
  // measure, scale, and only then reveal — this is what removed the snap
  // fit twice while still invisible (fonts and images can settle between the two), then reveal.
  // Nothing re-scales after this point, so there is no jump to see.
  const reveal = () => { el.classList.remove('pre'); el.classList.add('in'); };
  const imgs = [...fit.querySelectorAll('img')].filter(im => !im.complete);
  Promise.all(imgs.map(im => new Promise(r => {
    im.addEventListener('load', r, { once: true }); im.addEventListener('error', r, { once: true });
  }))).then(() => requestAnimationFrame(() => {
    refit();
    requestAnimationFrame(() => { refit(); requestAnimationFrame(reveal); });
  }));
  if (!imgs.length) requestAnimationFrame(() => {
    refit(); requestAnimationFrame(() => { refit(); requestAnimationFrame(reveal); });
  });
  fit.querySelectorAll('img').forEach(img => {
    if (!img.complete) img.addEventListener('load', refit, { once: true });
    img.addEventListener('error', refit, { once: true });
  });
  // no total is shown anywhere — position only. The flow is 29 screens and used to claim 17.
  fill.style.width = Math.round((i / LAST) * 100) + '%';

  // ⛔ The chrome buttons persist across screens, so addEventListener would stack a new handler
  // every step and one tap would jump several screens. Assign, don't add.
  goBtn.onclick   = () => { if (i < LAST) { i++; render(false); } };
  skipBtn.onclick = () => { if (i < LAST) { i++; render(false); } };
  backBtn.onclick = () => { if (i > 0) { i--; render(true); } };
  bindState(el, i);
  el.querySelectorAll('.lang button').forEach(x => x.addEventListener('click', () => {
    el.querySelectorAll('.lang button').forEach(y => y.classList.remove('on'));
    x.classList.add('on');
  }));
}
render(false);
</script></body></html>
